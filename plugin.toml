id = "station-airplay"
name = "Station airplay"
version = "1.2.0"
entry = "bin/launch.sh"
description = "AirPlay receiver: Light 2 (AirPlay 2), Station 2 and Mini 3 Pro (AirPlay 1, shared audio with Alice)."
permissions = ["exec", "clock", "led"]

[launch]
kind = "binary"
mode = "service"
path = "bin/launch.sh"
library_paths = ["lib"]

[compatibility]
models = ["yandexplum", "plum", "yandexstation_2", "yandexmini_3_pro"]
features = []
