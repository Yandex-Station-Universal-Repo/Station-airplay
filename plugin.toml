id = "station-airplay"
name = "Station airplay"
version = "1.3.2"
entry = "bin/station-airplay"
description = "AirPlay 2 receiver: Light 2, Station 2 and Mini 3 Pro; shared audio with Alice on Station 2/Mini 3 Pro."
permissions = ["exec", "clock", "led"]

[launch]
kind = "binary"
mode = "service"
path = "bin/station-airplay"
library_paths = ["lib"]

[compatibility]
models = ["yandexplum", "plum", "yandexstation_2", "yandexmini_3_pro"]
features = []
