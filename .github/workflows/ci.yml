name: Build Station AirPlay YAP

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' plugin.toml | head -n 1)
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
      - name: Go tests and vet
        working-directory: source
        run: |
          go test -count=1 ./...
          go vet ./...
      - name: Control wire and gain policy regression tests
        run: |
          (cd source && go test -race -count=1 ./...)
          python3 tests/test_stream_gain.py
      - name: Host migration and namespace checks
        run: |
          python3 tests/test_host_migration.py
          python3 -m unittest discover -s tests -p 'test_shared_migration.py' -v
          gcc -fsyntax-only -Wall -Wextra -Werror support/avahi-namespace.c
      - name: Build both supervisor targets
        working-directory: source
        run: |
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../bin/station-airplay .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w' -o /tmp/station-airplay-aarch64 .
      - name: Pack only the static supervisor with verified UPX
        run: |
          curl -fsSL https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-amd64_linux.tar.xz -o /tmp/upx.tar.xz
          echo '402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657  /tmp/upx.tar.xz' | sha256sum -c -
          tar -xJf /tmp/upx.tar.xz -C /tmp
          /tmp/upx-5.2.1-amd64_linux/upx --best --lzma bin/station-airplay
          /tmp/upx-5.2.1-amd64_linux/upx -t bin/station-airplay
      - name: Build and verify the single package
        run: |
          python3 scripts/package.py
          python3 tests/test_package.py
          (cd dist && sha256sum "station-airplay-${VERSION}.yap" > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: station-airplay-${{ env.VERSION }}
          path: |
            dist/*.yap
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: station-airplay-*
          merge-multiple: true
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.yap dist/SHA256SUMS --title "Station AirPlay $TAG" --generate-notes --verify-tag
